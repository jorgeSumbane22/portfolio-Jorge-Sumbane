<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>Página não encontrada | Jorge Sumbane</title>
    <style>
        :root { --bg: #f8fafc; --text: #0f172a; --muted: #475569; --brand: #2563eb; }
        @media (prefers-color-scheme: dark) { :root { --bg: #0b1120; --text: #e2e8f0; --muted: #a5b4cf; --brand: #3b82f6; } }
        * { box-sizing: border-box; margin: 0; }
        body {
            min-height: 100vh; display: grid; place-items: center; padding: 24px;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg); color: var(--text); text-align: center;
        }
        .code {
            font-size: clamp(5rem, 20vw, 9rem); font-weight: 800; line-height: 1;
            background: linear-gradient(135deg, #1d4ed8, #3b82f6 55%, #06b6d4);
            -webkit-background-clip: text; background-clip: text; color: transparent;
        }
        h1 { font-size: 1.5rem; margin: 12px 0 8px; }
        p { color: var(--muted); max-width: 420px; margin: 0 auto 28px; }
        a {
            display: inline-block; padding: 12px 24px; border-radius: 999px;
            background: var(--brand); color: #fff; font-weight: 600; text-decoration: none;
        }
        a:hover { filter: brightness(1.1); }
    </style>
</head>
<body>
    <main>
        <div class="code">404</div>
        <h1>Página não encontrada</h1>
        <p>O endereço que procura não existe ou foi movido.</p>
        <a href="https://jorgesumbane22.github.io/portfolio-Jorge-Sumbane/">Voltar ao portfólio</a>
    </main>
</body>
</html>
