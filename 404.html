<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>Página não encontrada | Jorge Sumbane</title>
    <!--
        Esta página pode ser mostrada em qualquer endereço do site, por isso
        usa estilos próprios e caminhos absolutos (não depende de assets/ relativos).
    -->
    <link rel="icon" type="image/svg+xml" href="https://jorgesumbane22.github.io/portfolio-Jorge-Sumbane/favicon.svg">
    <script>
        (function () {
            var d = document.documentElement, t = null, l = null;
            try { t = localStorage.getItem('theme'); l = localStorage.getItem('lang'); } catch (e) {}
            if (!t) t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
            if (!l) l = (navigator.language || 'pt').toLowerCase().indexOf('pt') === 0 ? 'pt' : 'en';
            d.setAttribute('data-theme', t);
            d.setAttribute('data-lang', l);
            d.lang = l;
        })();
    </script>
    <style>
        @font-face {
            font-family: "Plus Jakarta Sans";
            font-weight: 600 800;
            font-display: swap;
            src: url("https://jorgesumbane22.github.io/portfolio-Jorge-Sumbane/assets/fonts/plus-jakarta-sans-latin.woff2") format("woff2");
        }
        @font-face {
            font-family: "Inter";
            font-weight: 400 600;
            font-display: swap;
            src: url("https://jorgesumbane22.github.io/portfolio-Jorge-Sumbane/assets/fonts/inter-latin.woff2") format("woff2");
        }
        :root {
            --bg: #f8fafc; --surface: #fff; --text: #0f172a; --muted: #475569; --border: #e2e8f0;
            --brand: #2563eb; --grad: linear-gradient(135deg, #1d4ed8, #3b82f6 55%, #06b6d4);
            color-scheme: light;
        }
        [data-theme="dark"] {
            --bg: #0b1120; --surface: #131c31; --text: #e2e8f0; --muted: #a5b4cf; --border: #23304d; --brand: #3b82f6;
            color-scheme: dark;
        }
        * { box-sizing: border-box; margin: 0; }
        body {
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
            font-family: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            background:
                radial-gradient(520px 360px at 80% 15%, rgba(59, 130, 246, .16), transparent 70%),
                radial-gradient(460px 320px at 10% 90%, rgba(6, 182, 212, .12), transparent 70%),
                var(--bg);
            color: var(--text);
            text-align: center;
        }
        main { max-width: 460px; animation: in .6s cubic-bezier(.16, 1, .3, 1) both; }
        .logo {
            width: 52px; height: 52px; margin: 0 auto 26px;
            display: grid; place-items: center;
            border-radius: 15px; background: var(--grad); color: #fff;
            font: 800 1.1rem "Plus Jakarta Sans", sans-serif;
        }
        .code {
            font: 800 clamp(5rem, 22vw, 8.5rem)/1 "Plus Jakarta Sans", sans-serif;
            letter-spacing: -.04em;
            background: var(--grad);
            -webkit-background-clip: text; background-clip: text; color: transparent;
        }
        h1 { font: 700 1.5rem "Plus Jakarta Sans", sans-serif; margin: 14px 0 8px; }
        p { color: var(--muted); margin-bottom: 28px; }
        .actions { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; }
        a {
            display: inline-flex; align-items: center; gap: 8px;
            min-height: 46px; padding: 0 22px; border-radius: 999px;
            font-weight: 600; text-decoration: none;
            transition: transform .2s, filter .2s, border-color .2s;
        }
        a:hover { transform: translateY(-2px); }
        .primary { background: var(--brand); color: #fff; }
        .primary:hover { filter: brightness(1.1); }
        .ghost { border: 1.5px solid var(--border); color: var(--text); background: var(--surface); }
        .ghost:hover { border-color: var(--brand); }
        a:focus-visible { outline: 3px solid var(--brand); outline-offset: 3px; }
        [data-lang="pt"] [lang="en"], [data-lang="en"] [lang="pt"] { display: none; }
        @keyframes in { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }
        @media (prefers-reduced-motion: reduce) { main { animation: none; } a { transition: none; } }
    </style>
</head>
<body>
    <main>
        <div class="logo" aria-hidden="true">JS</div>
        <div class="code" aria-hidden="true">404</div>

        <h1 lang="pt">Página não encontrada</h1>
        <h1 lang="en">Page not found</h1>
        <p lang="pt">O endereço que procura não existe ou foi movido.</p>
        <p lang="en">The page you are looking for does not exist or has moved.</p>

        <div class="actions">
            <a class="primary" lang="pt" href="https://jorgesumbane22.github.io/portfolio-Jorge-Sumbane/">Voltar ao portfólio</a>
            <a class="primary" lang="en" href="https://jorgesumbane22.github.io/portfolio-Jorge-Sumbane/?lang=en">Back to portfolio</a>
            <a class="ghost" lang="pt" href="https://jorgesumbane22.github.io/portfolio-Jorge-Sumbane/#projetos">Ver projetos</a>
            <a class="ghost" lang="en" href="https://jorgesumbane22.github.io/portfolio-Jorge-Sumbane/?lang=en#projetos">View projects</a>
        </div>
    </main>
</body>
</html>
